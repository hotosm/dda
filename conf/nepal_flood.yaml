# Nepal Flood 2026, Upper Trishuli and Bhote Koshi corridor building damage.
# Run: dda run --config conf/nepal_flood.yaml   (resume: -s <stage>)

area: nepal_flood_upperstream
outputs_root: outputs

aoi: aoi_nepal_flood.geojson
tm_aoi_project: null

pre_img: https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
post_img: outputs/nepal_flood_upperstream/vantor/composite_v6/post_composite.tif
zoom: 18
photometric_calibration: true
stretch_percentiles: true
keep_raw: true
shift_direction: post_to_pre
# Cross-source pair, SIFT drops below the inlier threshold; composite is already on the pre grid.
skip_drift: true
pre_gamma: 1.15
post_gamma: 0.85

buildings:
  source: osm
  ckpt: null
  fewshot:
    tm_projects: []
    imagery_tms_override: null
    hpo_trials: 8
    hpo_seeds: 1
    epochs: 10
    val_frac: 0.3
    patience: 3
    lr: 5.0e-5
    zoom: 18

damage:
  ckpt: outputs/nepal_flood_upperstream/vantor/fewshot_damage_ft02/ckpts/ft-09-0.4471.ckpt

# raw-data-api pulls both standing and destroyed:building lifecycle features.
osm_source: raw_data_api
osm_tag_families:
  - { key: building, status: standing }
  - { key: "destroyed:building", status: destroyed }

damage_output_schema:
  - osm_id
  - osm_type
  - building
  - damage
  - damage_confidence
damage_label_map:
  -1: no-data
  0: no-visible-damage
  1: minor-damage
  2: major-damage
  3: destroyed
damage_palette:
  no-visible-damage: "#d9d0c9"
  minor-damage: "#ffd400"
  major-damage: "#ff8c00"
  destroyed: "#d73f3f"
  no-data: "#6b7280"
damage_provenance_imagery_pre: "ESRI World Imagery"
damage_provenance_imagery_post: "Vantor 9-scene composite (WV02/WV03/LG01), 2026-08-27..28"
damage_provenance_damage_model: "kshitijrajsharma/dinov3-damage-assessment @ ft-01-0.4607 (OSM-tuned, binary head)"

publish:
  enabled: false
  repo_id: hotosm/nepal_flood_2026
