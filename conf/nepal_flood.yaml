# Nepal Flood 2026, Upper Trishuli and Bhote Koshi corridor building damage.
# Run: dda run --config conf/nepal_flood.yaml   (resume: -s <stage>)

area: nepal_flood_upperstream
outputs_root: outputs

aoi: aoi_nepal_flood.geojson
tm_aoi_project: null

pre_img: https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
post_img: https://production-raw-data-api.s3.amazonaws.com/ISO3/NPL/disasters/nepal-flood/2026-08-28/vantor_composite_v3.tif
zoom: 18
photometric_calibration: true
stretch_percentiles: true
keep_raw: true
shift_direction: post_to_pre

buildings:
  source: osm
  ckpt: null
  fewshot:
    tm_projects: []
    imagery_tms_override: null
    hpo_trials: 8
    hpo_seeds: 1
    epochs: 10
    val_frac: 0.3
    patience: 3
    lr: 5.0e-5
    zoom: 18

damage:
  ckpt: null

# raw-data-api + destroyed:building lifecycle, per schema audit.
osm_source: raw_data_api
osm_tag_families:
  - { key: building, status: standing }
  - { key: "destroyed:building", status: destroyed }

damage_output_schema:
  - osm_id
  - osm_type
  - building
  - osm_status
  - damage_class
  - damage
  - damage_confidence
  - imagery_pre
  - imagery_post
damage_label_map:
  -1: no-data
  0: no-visible-damage
  1: minor-damage
  2: major-damage
  3: destroyed
damage_provenance_imagery_pre: "ESRI World Imagery"
damage_provenance_imagery_post: "Vantor 9-scene composite (WV02/WV03/LG01), 2026-08-27..28"
damage_provenance_damage_model: "kshitijrajsharma/dinov3-damage-assessment @ ft-01-0.4607 (OSM-tuned, binary head)"

publish:
  enabled: false
  repo_id: hotosm/nepal_flood_2026
