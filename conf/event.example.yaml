# dda event config. Run: dda run --config conf/event.example.yaml
# Override any field via OmegaConf dotlist, e.g. buildings.fewshot.hpo_trials=4
# Start from a specific stage with -s <stage>.

area: pereira_downtown
outputs_root: outputs

aoi: outputs/pereira_downtown/aoi.geojson
tm_aoi_project: null

pre_img:  https://oin-hotosm-temp.s3.us-east-1.amazonaws.com/6a7cb2bef7b084f6608726ad/0/6a7cb2bef7b084f6608726ae.tif
post_img: https://oin-hotosm-temp.s3.us-east-1.amazonaws.com/6a7cb280f7b084f660872669/0/6a7cb280f7b084f66087266a.tif
zoom: 19
photometric_calibration: true
stretch_percentiles: true
keep_raw: false

buildings:
  source: fair                        # fair | osm | input
  input: null
  ckpt: null
  fewshot:
    tm_projects: []
    imagery_tms_override: null
    hpo_trials: 8                     # 0 disables HPO
    hpo_seeds: 1
    epochs: 10
    val_frac: 0.3
    patience: 3
    lr: 5.0e-5
    zoom: 19

damage:
  ckpt: null

# OSM pull config; used when buildings.source == osm.
osm_source: raw_data_api              # raw_data_api | postpass
osm_tag_families:
  - {key: building, status: standing}
  # - {key: "destroyed:building", status: destroyed}

damage_output_schema:
  - osm_id
  - osm_type
  - building
  - osm_status
  - damage_class
  - damage
  - damage_confidence
  - damage_model
  - imagery_pre
  - imagery_post
damage_provenance_imagery_pre: ""
damage_provenance_imagery_post: ""
damage_provenance_damage_model: ""

publish:
  enabled: false
  repo_id: null
